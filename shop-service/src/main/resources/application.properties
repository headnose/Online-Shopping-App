server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/shopping_app?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Shared JWT signing key (base64). Must be the same value in both services.
jwt.secret=${JWT_SECRET}
